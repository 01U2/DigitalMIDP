name: Release

# Triggered by pushing a version tag (e.g. v0.2.0) on the release branch `main`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag ${{ github.ref_name }} does not point to a commit on 'main'. Releases must be tagged from main."
            exit 1
          }

      - name: Get version from tag
        id: ver
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag must be in the form vMAJOR.MINOR.PATCH (got '${{ github.ref_name }}')."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DigitalMIDP.sln

      - name: Build solution
        run: dotnet build DigitalMIDP.sln --configuration Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test DigitalMIDP.Tests/DigitalMIDP.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Locate and rename MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path DigitalMIDP.Installer/bin/x64/Release -Recurse -Filter 'DigitalMIDP-Setup.msi' | Select-Object -First 1
          if (-not $msi) { Write-Error 'DigitalMIDP-Setup.msi not found.'; exit 1 }
          $target = Join-Path $msi.DirectoryName "DigitalMIDP-Setup-${{ steps.ver.outputs.version }}.msi"
          Copy-Item $msi.FullName $target
          "path=$target" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DigitalMIDP ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.msi.outputs.path }}
